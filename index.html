<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hopopo — شادوینگ روزانه</title>
<meta name="description" content="تمرین روزانهٔ شادوینگ انگلیسی و آلمانی از روی کتاب خودت">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#1d2433; --muted:#6b7080; --line:#e6e0d6;
  --en:#2f6fed; --de:#d9861a; --ok:#2e9d62; --danger:#c8423b;
  --radius:18px; --shadow:0 1px 2px rgba(29,36,51,.06),0 6px 24px rgba(29,36,51,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151c; --card:#1b1f29; --ink:#eef0f5; --muted:#9aa0ae; --line:#2b3140; --shadow:none; --en:#6b9bff; --de:#f0a640;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0}
h3{font-size:1rem;margin:0 0 10px}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.top{display:flex;align-items:center;gap:10px;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.track{border-top:5px solid var(--acc)}
.trow{display:flex;justify-content:space-between;align-items:center}
.lang{display:flex;gap:12px;align-items:center}
.lang b{display:block;font-size:1.15rem}
.lang small{color:var(--muted)}
.code{width:46px;height:46px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-family:Literata,serif;letter-spacing:.04em}
.streak{font-weight:800;font-size:1.05rem}
.book{margin:12px 0 6px;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:4px}
.week{display:flex;gap:6px;margin:12px 0}
.week span{flex:1;text-align:center;font-size:.78rem;padding:4px 0;border-radius:10px;background:var(--bg);color:var(--muted);border:1px solid transparent}
.week span.on{background:var(--acc);color:#fff}
.week span.today{border-color:var(--acc)}
.btns{display:flex;flex-direction:column;gap:8px}
.primary{background:var(--acc,var(--ink));color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;font-size:1rem;width:100%}
.primary:active{transform:scale(.99)}
.ghost{border:1px solid var(--line);border-radius:14px;padding:10px 16px;width:100%;color:var(--ink)}
.small{padding:8px 12px;border-radius:12px;font-size:.9rem;width:auto;white-space:nowrap}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;border:1px solid var(--line);background:var(--card)}
.note{font-size:.9rem}
.note p{margin:6px 0 10px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.85rem}
.bookitem{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bookitem>button:first-child{flex:1;text-align:right;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.bookitem.active>button:first-child{border:2px solid var(--acc);background:var(--card)}
.bookitem small{display:block;color:var(--muted);font-size:.8rem}
.del.confirm{width:auto;padding:0 10px;font-size:.85rem;color:#fff;background:var(--danger);border-color:var(--danger)}
details.import{margin-top:6px}
details.import summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--acc)}
.file{display:block;border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;margin:6px 0}
.file input{display:none}
.or{text-align:center;color:var(--muted);font-size:.85rem;margin:8px 0}
input[type=text],input[type=number],input[type=search],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);margin-bottom:8px}
textarea{resize:vertical;font-family:Literata,serif}
.row{display:flex;gap:8px;align-items:center}
.row input{margin:0}
.row label{white-space:nowrap;font-size:.9rem}

.msg.err{color:var(--danger)}
.preview{font-family:Literata,serif;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:.95rem;text-align:left}
.results{margin:8px 0}
.res{display:block;width:100%;text-align:left;font-family:Literata,serif;font-size:.88rem;border-bottom:1px solid var(--line);padding:8px 4px}
.res em{font-style:normal;color:var(--muted);font-family:Vazirmatn,sans-serif;font-size:.78rem;float:right}
.field{margin-bottom:14px}
.field>span{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.field>span output{font-weight:700;color:var(--acc)}
input[type=range]{width:100%;accent-color:var(--acc)}
.check{display:flex;gap:8px;align-items:center;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.hint{font-size:.84rem;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0 0}
.warn{color:var(--danger)}
/* session */
.session{display:flex;flex-direction:column;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px)}
.stop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.stitle{font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.95rem}
.sbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.sbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.phase{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--acc) 12%,transparent);margin-bottom:10px}
.phase b{display:block;color:var(--acc);font-size:1.05rem}
.phase small{color:var(--muted)}
.counter{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.textcard{flex:1;min-height:180px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;
  font-family:Literata,Georgia,serif;font-size:1.4rem;line-height:1.75;text-align:left;box-shadow:var(--shadow);display:flex;align-items:center;transition:filter .25s}

.textcard.lvl-a{font-size:1.7rem}

.textcard.blind:not(.peek)::after{content:""}
.textcard .w.ok{color:var(--ok);font-weight:600}

.score{display:inline-block;border-radius:99px;padding:0 10px;color:#fff;font-weight:700;margin-inline-start:6px}
.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.gap{visibility:hidden;margin:12px 0 0;text-align:center;font-weight:700;color:var(--acc)}
.gap.on{visibility:visible}
.gapbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.gapbar i{display:block;height:100%;width:100%;background:var(--acc)}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 10px}
.icon.big{width:54px;height:54px;border-radius:50%;font-size:1.25rem}
.play{width:76px;height:76px;border-radius:50%;background:var(--acc);color:#fff;font-size:1.8rem;display:grid;place-items:center;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 40%,transparent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.88rem;background:var(--card);color:var(--ink);text-decoration:none}
.chip.rec{background:var(--danger);color:#fff;border-color:var(--danger)}
.hidden{display:none!important}
.lookup{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.18);z-index:20}

.sheet .btns{flex-direction:row}
.done{text-align:center;padding-top:40px}
.done .big{font-size:4rem;line-height:1}
.done h2{margin:12px 0 4px;font-size:1.4rem}
.stats{display:flex;gap:10px;margin:22px 0}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stats b{display:block;font-size:1.5rem;color:var(--acc)}
.stats small{color:var(--muted)}
.picks{margin-top:12px;border:2px solid var(--acc);border-radius:16px;padding:12px}
.pickhead{font-weight:700;margin-bottom:8px}
.pickhead small{display:block;font-weight:400;color:var(--muted)}
.pick{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.pick input{width:20px;height:20px;margin-top:4px;accent-color:var(--acc);flex:none}
.pick>div{flex:1;min-width:0}
.pick small{display:block;color:var(--muted);font-size:.82rem}
.badge{display:inline-block;font-size:.75rem;background:var(--acc);color:#fff;border-radius:99px;padding:0 8px}
.ptext{font-family:Literata,serif;font-size:.9rem;text-align:left;background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;max-height:180px;overflow:auto}
.picks .primary{margin-top:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;z-index:40;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const LANGS = {
  en:{name:'English', fa:'انگلیسی', code:'en-US', prefix:'en', wps:2.6, flag:'EN', color:'var(--en)'},
  de:{name:'Deutsch', fa:'آلمانی',  code:'de-DE', prefix:'de', wps:2.2, flag:'DE', color:'var(--de)'}
};
// phase types: listen | echo (listen, then repeat in the gap) | shadow (speak along) ; blind = text hidden
const PROFILES = {
  A1:{maxWords:8,  phases:[{t:'listen',r:.7},{t:'echo',r:.7},{t:'echo',r:.8},{t:'shadow',r:.8},{t:'shadow',r:.85}], finalRate:.8},
  A2:{maxWords:10, phases:[{t:'listen',r:.8},{t:'echo',r:.8},{t:'shadow',r:.85},{t:'shadow',r:.9}], finalRate:.85},
  B1:{maxWords:15, phases:[{t:'listen',r:.9},{t:'echo',r:.9},{t:'shadow',r:.95},{t:'shadow',r:.95,blind:true}], finalRate:.95},
  B2:{maxWords:22, phases:[{t:'listen',r:1},{t:'shadow',r:1},{t:'shadow',r:1.05,blind:true}], finalRate:1},
  C1:{maxWords:30, phases:[{t:'listen',r:1.05},{t:'shadow',r:1.05},{t:'shadow',r:1.1,blind:true}], finalRate:1.05}
};
const PHASE_TXT = {
  listen:['فقط گوش بده','به آهنگ، تکیه و مکث‌های جمله دقت کن.'],
  echo:['گوش بده، بعد تکرار کن','وقتی صدا تمام شد، همان جمله را بلند و با همان آهنگ بگو.'],
  shadow:['همزمان بخوان','هم‌زمان با صدا (یا نیم‌ثانیه پشتش) بلند بخوان.'],
  blind:['شادوینگ بدون متن','متن پنهان است؛ فقط با گوش دنبال کن. برای دیدن، روی کارت بزن.'],
  check:['گوش بده، بعد بگو','بعد از صدا جمله را بلند بگو. کلمه‌های درست سبز، تقریباً درست نارنجی و اشتباه یا جاافتاده قرمز می‌شوند.'],
  final:['شادوینگ پیوسته','کل متن امروز پشت سر هم پخش می‌شود؛ بدون توقف همراهش بخوان.'],
  review:['مرور جلسهٔ قبل','گرم کردن با آخرین جمله‌های دفعهٔ پیش؛ همزمان بخوان.']
};
const WD = ['ی','د','س','چ','پ','ج','ش'];
const PDFJS = 'lib/pdf.min.js';
const PDFJS_WORKER = 'lib/pdf.worker.min.js';
const JSZIP = 'lib/jszip.min.js';

const SAMPLES = {
  de:{title:'نمونه: Mein Tag (A1)', text:
`Ich heiße Lena. Ich bin dreißig Jahre alt. Ich wohne in Hamburg. Meine Wohnung ist klein, aber hell.

Am Morgen stehe ich um sieben Uhr auf. Ich trinke einen Kaffee und esse ein Brötchen. Dann fahre ich mit dem Bus zur Arbeit. Ich arbeite in einem Büro. Meine Kollegen sind nett.

Um zwölf Uhr esse ich mit Tom zu Mittag. Tom kommt aus Spanien. Er spricht gut Deutsch. Am Nachmittag habe ich viele Termine. Um fünf Uhr gehe ich nach Hause.

Am Abend koche ich gern. Heute koche ich Nudeln mit Tomatensoße. Dann lese ich ein Buch, oder ich sehe fern.

Am Wochenende besuche ich meine Eltern. Sie wohnen in einem Dorf. Dort ist es sehr ruhig. Wir gehen zusammen spazieren. Ich bin gern bei meinen Eltern.`},
  en:{title:'Sample: The Quiet Power of Small Habits (B2)', text:
`Most people imagine that big changes require big decisions. In reality, the habits that shape our lives are usually small, almost invisible actions repeated day after day.

Consider someone who wants to become fluent in a new language. Spending an entire weekend memorising vocabulary might feel productive, but the knowledge tends to fade within a week. On the other hand, fifteen minutes of focused practice every morning builds a foundation that keeps growing.

The secret is not intensity but consistency. When an activity becomes part of your routine, it stops depending on motivation. You no longer have to negotiate with yourself every time you sit down to practise.

Researchers who study learning often point out that the brain strengthens the connections it uses most frequently. In other words, repetition is not boring busywork; it is how skills become automatic.

Of course, a habit only works if it is realistic. If you set a goal that requires two hours a day, you will probably give up as soon as life gets busy. It is far better to choose something so manageable that you can do it even on your worst day.

Over months, those modest sessions add up to hundreds of hours of practice. Looking back, you may be surprised by how far you have travelled, one small step at a time.`}
};

/* ---------- helpers ---------- */
let view='home', curLang=null;
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
const wc = s => s.split(/\s+/).filter(Boolean).length;
const pad = n => String(n).padStart(2,'0');
const mmss = sec => { sec=Math.max(0,Math.round(sec)); return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`; };
function dayKey(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
let toastT;
function toast(msg, ms=3200){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'), ms); }

/* ---------- storage ---------- */
const LS_KEY = 'shadowing.v1';
function defTrack(lang){
  const id = 'sample-'+lang;
  return {lang, level: lang==='en'?'B2':'A1', minutes: lang==='en'?15:12, speed:1, voiceURI:'', warmup:true, check:true, checkReps:2,
    bookId:id, books:{[id]:{title:SAMPLES[lang].title, pos:0, total:0, last:null, sample:true}}, history:[]};
}
function loadState(){
  try{
    const j = JSON.parse(localStorage.getItem(LS_KEY));
    if(j && j.tracks){ for(const k of ['en','de']) j.tracks[k] = Object.assign(defTrack(k), j.tracks[k]); return j; }
  }catch(e){}
  return {tracks:{en:defTrack('en'), de:defTrack('de')}};
}
let S = loadState();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

const DB = (()=>{
  let dbp; const mem = new Map();
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      try{ const r = indexedDB.open('shadowing',1);
        r.onupgradeneeded = ()=> r.result.createObjectStore('books');
        r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function get(k){
    if(mem.has(k)) return mem.get(k);
    try{ const db=await open(); const v = await new Promise((res,rej)=>{ const q=db.transaction('books').objectStore('books').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); if(v) mem.set(k,v); return v; }
    catch(e){ return undefined; }
  }
  async function put(k,v){ mem.set(k,v); try{ const db=await open(); await new Promise((res,rej)=>{ const tx=db.transaction('books','readwrite'); tx.objectStore('books').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
  async function del(k){ mem.delete(k); try{ const db=await open(); await new Promise(res=>{ const tx=db.transaction('books','readwrite'); tx.objectStore('books').delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
  return {get,put,del};
})();

/* ---------- text processing ---------- */
function normalize(raw){
  const t = raw.replace(/\r/g,'').replace(/­/g,'').replace(/(\p{L})-\n\s*(\p{Ll})/gu,'$1$2');
  const paras=[]; let cur=[];
  const flush=()=>{ if(cur.length) paras.push(cur.join(' ')); cur=[]; };
  for(const raw of t.split('\n')){
    const l = raw.replace(/\s+/g,' ').trim();
    if(!l){ flush(); continue; }
    if(/^[\dIVXLCivxlc.\-–—\s]+$/.test(l)) continue;           // page numbers
    if(wc(l)<=5 && !/[.!?…:;,"”»«)]$/.test(l)){ flush(); continue; } // headings / labels
    cur.push(l);
  }
  flush();
  return paras;
}
function splitSentences(paras, lang){
  const seg = (typeof Intl!=='undefined' && Intl.Segmenter) ? new Intl.Segmenter(lang,{granularity:'sentence'}) : null;
  const out=[];
  for(const p of paras){
    const parts = seg ? [...seg.segment(p)].map(x=>x.segment) : (p.match(/[^.!?…]+[.!?…]+["'»«“”)]*\s*|[^.!?…]+$/g) || [p]);
    for(const s of parts){ const x=s.trim(); if(x && /\p{L}/u.test(x)) out.push(x); }
  }
  return out;
}
function textToSentences(raw, lang){ return splitSentences(normalize(raw), lang); }

function chunkSentence(s, maxW){
  if(wc(s)<=maxW) return [s];
  let parts = s.replace(/([,;:–—])\s+/g,'$1\u0001').split('\u0001');
  const conj = /\s+(?=(?:and|but|because|which|who|that|when|while|although|so|if|und|aber|weil|dass|wenn|denn|oder|sondern|als|damit|obwohl)\s)/i;
  parts = parts.flatMap(p => wc(p)>maxW ? p.split(conj) : [p]);
  parts = parts.flatMap(p=>{
    const w=p.split(/\s+/).filter(Boolean); if(w.length<=maxW) return [p];
    const n=Math.ceil(w.length/maxW), size=Math.ceil(w.length/n), r=[];
    for(let i=0;i<w.length;i+=size) r.push(w.slice(i,i+size).join(' '));
    return r;
  });
  const out=[];
  for(const p of parts.map(x=>x.trim()).filter(Boolean)){
    const last=out[out.length-1];
    if(last && (wc(p)<3 || wc(last)<3) && wc(last)+wc(p)<=maxW+2) out[out.length-1]=last+' '+p; else out.push(p);
  }
  return out;
}
function phasesFor(t){
  const prof=PROFILES[t.level];
  if(!t.check) return prof.phases;
  const n=Math.max(1, Math.min(3, t.checkReps||2));
  const ref=prof.phases.find(p=>p.t==='echo') || prof.phases.find(p=>p.t==='listen');
  const checks=Array.from({length:n}, (_,i)=>({t:'check', r:ref.r, n:i+1, of:n}));
  return [...prof.phases.filter(p=>p.t==='listen'), ...checks, ...prof.phases.filter(p=>p.t==='shadow')];
}
function estDur(text, rate, lang){ return wc(text)/(LANGS[lang].wps*rate) + 0.5; }
function stepTime(text, t, rate, lang){ const d=estDur(text,rate,lang); return (t==='echo' ? d*2.25+1 : t==='check' ? d*2.6+3.5 : d) + 0.6; }

async function pdfToText(pdf, onProg){
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    const lines=[]; let line='', lastY=null, lastH=0, prevLineY=null;
    for(const it of tc.items){
      if(!('str' in it)) continue;
      const y=it.transform[5];
      if(lastY!==null && Math.abs(y-lastY)>2 && line.trim()){
        if(prevLineY!==null && Math.abs(prevLineY-lastY) > (lastH||10)*1.9) lines.push('');
        lines.push(line); prevLineY=lastY; line='';
      }
      line += it.str; lastY=y; lastH=it.height||lastH;
      if(it.hasEOL){ if(line.trim()){ lines.push(line); prevLineY=y; } line=''; }
    }
    if(line.trim()) lines.push(line);
    pages.push(lines.join('\n'));
    if(onProg) onProg(p, pdf.numPages);
  }
  return pages.join('\n');
}
function normPath(p){ const out=[]; for(const seg of p.split('/')){ if(seg==='..') out.pop(); else if(seg && seg!=='.') out.push(seg); } return out.join('/'); }
async function epubToText(file){
  if(!window.JSZip) await loadScript(JSZIP);
  const zip = await JSZip.loadAsync(file);
  const xml = s => new DOMParser().parseFromString(s,'application/xml');
  const opfPath = xml(await zip.file('META-INF/container.xml').async('string')).querySelector('rootfile').getAttribute('full-path');
  const opf = xml(await zip.file(opfPath).async('string'));
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/')+1) : '';
  const man={}; opf.querySelectorAll('manifest > item').forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
  const out=[];
  for(const ref of opf.querySelectorAll('spine > itemref')){
    const href=man[ref.getAttribute('idref')]; if(!href) continue;
    const f = zip.file(decodeURIComponent(normPath(base+href.split('#')[0]))); if(!f) continue;
    const doc = new DOMParser().parseFromString(await f.async('string'),'text/html');
    doc.querySelectorAll('script,style,h1,h2,h3,h4,h5,h6').forEach(n=>n.remove());
    const blocks=[...doc.body.querySelectorAll('p,li,blockquote,dd,div')].filter(el=>!el.querySelector('p,li,div,blockquote'));
    out.push(blocks.map(b=>b.textContent.replace(/\s+/g,' ').trim()).filter(Boolean).join('\n\n'));
  }
  return out.join('\n\n');
}

async function runOcr(lang, sources, label){

/* ---------- planning ---------- */
function buildPlan(t, meta, sentences){
  const prof = PROFILES[t.level], sp = t.speed, lang = t.lang, target = t.minutes*60;
  const chunks=[], steps=[]; let est=0;
  if(t.warmup && meta.last && meta.last[1]>meta.last[0] && meta.last[1]<=sentences.length){
    for(let s=Math.max(meta.last[0], meta.last[1]-2); s<meta.last[1]; s++){
      for(const c of chunkSentence(sentences[s], prof.maxWords)){
        const k=chunks.push({text:c, sent:s})-1;
        steps.push({k, sec:'review', ph:{t:'shadow', r:prof.finalRate*sp}}); est+=stepTime(c,'shadow',prof.finalRate*sp,lang);
      }
    }
  }
  const firstNew = chunks.length; let s = meta.pos;
  while(s < sentences.length){
    const cs = chunkSentence(sentences[s], prof.maxWords);
    let add=0;
    for(const c of cs){ for(const ph of phasesFor(t)) add+=stepTime(c,ph.t,ph.r*sp,lang); add+=stepTime(c,'shadow',prof.finalRate*sp,lang); }
    if(chunks.length>firstNew && est+add>target) break;
    est+=add; for(const c of cs) chunks.push({text:c, sent:s}); s++;
  }
  for(let k=firstNew;k<chunks.length;k++) for(const ph of phasesFor(t)) steps.push({k, sec:'main', ph:{...ph, r:ph.r*sp}});
  for(let k=firstNew;k<chunks.length;k++) steps.push({k, sec:'final', ph:{t:'shadow', r:prof.finalRate*sp}});
  return {chunks, steps, start:meta.pos, end:s, est, newCount:chunks.length-firstNew};
}

let curUtter=null;
function speak(text, rate, lang, onBoundary){

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const NUMS = {
  de:['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn','zwanzig'],
  en:['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty']
};
function fold(w, lang){
  let x=w.toLowerCase().normalize('NFC').replace(/[’']/g,"'").replace(/^[^\p{L}\p{N}']+|[^\p{L}\p{N}']+$/gu,'');
  if(/^\d+$/.test(x) && NUMS[lang][+x]) x=NUMS[lang][+x];
  return x.replace(/ß/g,'ss');
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function wordSim(a,b){ if(a===b) return 1; const strip=s=>s.normalize('NFD').replace(/\p{M}/gu,''); if(strip(a)===strip(b)) return .9; return 1 - lev(a,b)/Math.max(a.length,b.length); }
// aligns what was heard against the target; returns a mark per target word: ok | close | bad
function scoreSpeech(target, heard, lang){
  const T=target.split(/\s+/).filter(Boolean), tw=T.map(w=>fold(w,lang)), hw=heard.split(/\s+/).map(w=>fold(w,lang)).filter(Boolean);
  const m=tw.length, n=hw.length, D=[], B=[];
  for(let i=0;i<=m;i++){ D[i]=[]; B[i]=[]; for(let j=0;j<=n;j++){
    if(!i&&!j){ D[0][0]=0; continue; }
    let best=Infinity, bk=null;
    if(i&&j){ const sim=wordSim(tw[i-1],hw[j-1]); const c=D[i-1][j-1]+(sim>=.99?0:sim>=.7?.4:1); if(c<best){best=c;bk='d';} }
    if(i){ const c=D[i-1][j]+1; if(c<best){best=c;bk='u';} }
    if(j){ const c=D[i][j-1]+.6; if(c<best){best=c;bk='l';} }
    D[i][j]=best; B[i][j]=bk; } }
  const marks=new Array(m).fill('bad'); let i=m, j=n;
  while(i>0||j>0){ const b=B[i][j];
    if(b==='d'){ const sim=wordSim(tw[i-1],hw[j-1]); marks[i-1]= sim>=.99?'ok': sim>=.7?'close':'bad'; i--; j--; }
    else if(b==='u'){ marks[i-1]='bad'; i--; } else j--; }
  const words=tw.map((w,k)=>w?marks[k]:'ok');
  const score = m ? Math.round(100*words.reduce((a,x)=>a+(x==='ok'?1:x==='close'?.6:0),0)/m) : 0;
  return {marks:words, score};
}
let srBlocked=false;
function listenOnce(lang, maxMs, tok, onLive){
  return new Promise(res=>{
    if(!SR || srBlocked){ res(null); return; }
    let r; try{ r=new SR(); }catch(e){ res(null); return; }
    r.lang=LANGS[lang].code; r.interimResults=true; r.continuous=false; r.maxAlternatives=1;
    let text='', done=false, err=null, heardAny=false;
    const finish=()=>{ if(done) return; done=true; clearTimeout(maxT); clearInterval(watch); try{ r.abort(); }catch(e){}
      if(err==='not-allowed' || err==='service-not-allowed'){ srBlocked=true; res(null); } else res(text.trim()); };
    r.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript+' '; text=t; heardAny=true; if(onLive) onLive(text.trim()); };
    r.onerror=e=>{ err=e.error; finish(); };
    r.onend=finish;
    const maxT=setTimeout(finish, maxMs);
    const watch=setInterval(()=>{ if(tok!==R.token) finish(); },100);
    try{ r.start(); }catch(e){ err='start'; finish(); }
  });
}

/* ---------- stats ---------- */
function stats(t){
  const days = new Set(t.history.map(h=>h.d)), today=dayKey();
  let streak=0; const d=new Date(); if(!days.has(today)) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){ streak++; d.setDate(d.getDate()-1); }
  const week=[]; for(let i=6;i>=0;i--){ const x=new Date(); x.setDate(x.getDate()-i); week.push({done:days.has(dayKey(x)), today:i===0, label:WD[x.getDay()]}); }
  const todaySec = t.history.filter(h=>h.d===today).reduce((a,h)=>a+h.sec,0);
  return {streak, week, todaySec, doneToday: todaySec >= Math.min(600, t.minutes*60*0.6)};
}

  spans.forEach(s=>{ const a=+s.dataset.s, b=+s.dataset.e; s.classList.toggle('hl', ci>=a && ci<b); });
}
function showMarks(marks){ document.querySelectorAll('#textcard .w').forEach((s,i)=>{ s.classList.remove('ok','close','bad'); if(marks[i]) s.classList.add(marks[i]); }); }
function clearMarks(){ document.querySelectorAll('#textcard .w').forEach(s=>s.classList.remove('ok','close','bad')); const h=$('#heard'); if(h) h.innerHTML=''; }
function clearHl(){ document.querySelectorAll('#textcard .w.hl').forEach(s=>s.classList.remove('hl')); }
function wait(ms, tok, onTick){
  return new Promise(res=>{ const t0=Date.now(); const iv=setInterval(()=>{ const el=Date.now()-t0; if(onTick) onTick(el/ms); if(tok!==R.token || el>=ms){ clearInterval(iv); res(); } },50); });
}
async function runFrom(i){
  const tok = ++R.token; R.i=i; R.playing=true; updSession();
  while(R.i < R.plan.steps.length){
    if(tok!==R.token) return;
    commitProgress(); updSession();
    const st=R.plan.steps[R.i], c=R.plan.chunks[st.k];
    clearMarks();
    await speak(c.text, st.ph.r, R.lang, highlight);
    clearHl();
    if(tok!==R.token) return;
    if(st.ph.t==='check'){
      const dur=estDur(c.text, st.ph.r, R.lang), g=$('#gap'), gt=$('#gaptext'), hd=$('#heard');
      gt.textContent='🎙 حالا بگو… گوش می‌دهم'; gt.classList.add('listening'); $('#gapfill').style.width='100%'; g.classList.add('on');
      hd.innerHTML='';
      const heard = await listenOnce(R.lang, (dur*1.8+4)*1000, tok, t=>{ hd.innerHTML=`<span class="lbl">شنیدم: </span><span class="txt">${esc(t)}</span>`; });
      g.classList.remove('on'); gt.classList.remove('listening'); gt.textContent='نوبت توئه — بلند تکرار کن';
      if(tok!==R.token) return;
      if(heard===null){
        if(!R.srWarned){ R.srWarned=true; toast(srBlocked ? 'اجازهٔ میکروفون داده نشد؛ بدون بررسی ادامه می‌دهیم.' : (isFramed ? 'بررسی گفتار فقط در نسخهٔ نصب‌شدهٔ اپ کار می‌کند؛ اینجا فقط فرصت تکرار داری.' : 'این مرورگر تشخیص گفتار ندارد؛ Chrome یا Safari را امتحان کن.'), 5500); }
        g.classList.add('on');
        await wait((dur*1.25+1)*1000, tok, p=>{ const f=$('#gapfill'); if(f) f.style.width=(100-100*p)+'%'; });
        g.classList.remove('on'); if(tok!==R.token) return;
      } else {
        const res = heard ? scoreSpeech(c.text, heard, R.lang) : {marks:c.text.split(/\s+/).filter(Boolean).map(()=>'bad'), score:0};
        showMarks(res.marks);
        const col = res.score>=85 ? 'var(--ok)' : res.score>=60 ? 'var(--de)' : 'var(--danger)';
        hd.innerHTML = heard ? `<span class="lbl">شنیدم: </span><span class="txt">${esc(heard)}</span><span class="score" style="background:${col}">${fa(res.score)}٪</span>`
                             : `<span class="lbl">صدایی نشنیدم — بلندتر و نزدیک‌تر به گوشی بگو.</span>`;
        (R.scores = R.scores || []).push({k:st.k, n:st.ph.n, score:res.score});
        await wait(res.score>=85 ? 1600 : 2800, tok);
        if(tok!==R.token) return;
      }
    }
    if(st.ph.t==='echo'){
      const g=$('#gap'), f=$('#gapfill'); g.classList.add('on');
      await wait((estDur(c.text, st.ph.r, R.lang)*1.25+1)*1000, tok, p=>{ if(f) f.style.width=(100-100*p)+'%'; });
      g.classList.remove('on');
      if(tok!==R.token) return;
    }
    await wait(600, tok);
    if(tok!==R.token) return;
    R.i++;
  }
  finish();
}
function stopAudio(){ if(!R) return; R.token++; try{ speechSynthesis.cancel(); }catch(e){} const g=$('#gap'); if(g) g.classList.remove('on'); clearHl(); }
function pause(){ stopAudio(); R.playing=false; updSession(); }
function chunkStart(i){ const st=R.plan.steps, k=st[i].k, sec=st[i].sec; while(i>0 && st[i-1].k===k && st[i-1].sec===sec) i--; return i; }
function goNext(){ const st=R.plan.steps; let i=R.i; const k=st[i].k, sec=st[i].sec; while(i<st.length && st[i].k===k && st[i].sec===sec) i++; stopAudio(); if(i>=st.length){ R.i=st.length; finish(); } else runFrom(i); }
function goPrev(){ let s=chunkStart(R.i); if(R.i===s && s>0) s=chunkStart(s-1); stopAudio(); runFrom(s); }
function commitProgress(){
  const st=R.plan.steps[R.i]; if(st.sec!=='main') return;
  const meta=S.tracks[R.lang].books[R.bookId]; const s=R.plan.chunks[st.k].sent;
  if(meta && s>meta.pos){ meta.pos=s; save(); }
}
function saveSession(complete){
  const t=S.tracks[R.lang], meta=t.books[R.bookId];
  if(meta){
    if(complete) meta.pos=Math.max(meta.pos, R.plan.end);
    if(meta.pos>R.plan.start) meta.last=[R.plan.start, meta.pos];
  }
  const sec=Math.round(R.elapsed);
  if(sec>=30) t.history.push({d:dayKey(), sec, n: meta ? meta.pos-R.plan.start : 0});
  if(t.history.length>800) t.history=t.history.slice(-800);
  save();
}
function finish(){
  if(view!=='session') return;
  stopAudio(); R.playing=false; wakeLock(false);
  if(!R.extra) saveSession(true); else { const t=S.tracks[R.lang]; const sec=Math.round(R.elapsed); if(sec>=20){ t.history.push({d:dayKey(), sec, n:0}); save(); } }
  renderDone();
}
function renderDone(){
  view='done';
  const t=S.tracks[R.lang], L=LANGS[R.lang], st=stats(t);
  app.innerHTML = `<div class="done" style="--acc:${L.color}">
    <div class="big">✓</div><h2>آفرین! جلسهٔ ${L.fa} تمام شد</h2><p class="sub">ادامهٔ کتاب برای فردا آماده است.</p>
    <div class="stats"><div><b>${fa(Math.max(1,Math.round(R.elapsed/60)))}</b><small>دقیقه</small></div><div><b>${fa(R.plan.newCount)}</b><small>تکهٔ جدید</small></div><div><b>🔥 ${fa(st.streak)}</b><small>روز پشت‌سرهم</small></div></div>
    ${accuracyHtml()}
    <div class="btns"><button class="primary" data-act="again">⟲ یک دور دیگر شادوینگ پیوسته</button><button class="ghost" data-act="home">بازگشت به خانه</button></div></div>`;
}
function accuracyHtml(){
  const sc=R.scores||[]; if(!sc.length) return '';
  const avg=Math.round(sc.reduce((a,x)=>a+x.score,0)/sc.length);
  const last={}; sc.forEach(x=>{ last[x.k]=x.score; });
  const hard=Object.entries(last).filter(([,v])=>v<70).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k])=>R.plan.chunks[+k].text);
  return `<div class="card" style="text-align:right"><b>دقت گفتار: ${fa(avg)}٪</b>${hard.length?`<p class="sub" style="margin:6px 0">جمله‌هایی که بیشتر تمرین بخواهند:</p>${hard.map(h=>`<p class="preview" dir="ltr">${esc(h)}</p>`).join('')}`:'<p class="sub">عالی بود؛ همهٔ جمله‌ها خوب گفته شدند.</p>'}</div>`;
}
function againFinal(){
  const steps = R.plan.steps.filter(s=>s.sec==='final');
  if(!steps.length){ renderHome(); return; }
  R = {...R, plan:{...R.plan, steps}, i:0, token:0, playing:false, elapsed:0, extra:true};
  unlockAudio(); renderSession(); wakeLock(true); runFrom(0);
}
function askQuit(){
  pause();
  const o=document.createElement('div'); o.className='overlay'; o.id='quitov';
  o.innerHTML=`<div class="sheet"><b>جلسه را تمام می‌کنی؟</b><p>پیشرفتت تا همین جمله ذخیره می‌شود و دفعهٔ بعد از همین‌جا ادامه می‌دهی.</p>
    <div class="btns"><button class="ghost" data-act="resume">ادامه بده</button><button class="primary" style="--acc:var(--danger)" data-act="exit">خروج</button></div></div>`;
  document.body.appendChild(o);
}
let wl=null;
async function wakeLock(on){ try{ if(on && navigator.wakeLock){ wl=await navigator.wakeLock.request('screen'); } else if(!on && wl){ await wl.release(); wl=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && view==='session' && R && R.playing) wakeLock(true); });
setInterval(()=>{ if(view==='session' && R && R.playing){ R.elapsed++; updTimer(); } },1000);

/* ---------- recording (works in installed app; mic is blocked inside embedded previews) ---------- */
let rec=null, recURL=null, recAudio=null;
async function toggleRec(){
  const btn=$('#recbtn');
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  try{
    if(!navigator.mediaDevices || !window.MediaRecorder) throw new Error('no');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const parts=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{ if(e.data.size) parts.push(e.data); };
    rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); if(recURL) URL.revokeObjectURL(recURL); recURL=URL.createObjectURL(new Blob(parts,{type:rec.mimeType||'audio/webm'}));
      const b=$('#recbtn'); if(b){ b.classList.remove('rec'); b.textContent='🎙 ضبط دوباره'; } const p=$('#playrec'); if(p) p.classList.remove('hidden'); };
    rec.start(); btn.classList.add('rec'); btn.textContent='⏹ پایان ضبط';
    if(!R.playing) runFrom(chunkStart(R.i));
  }catch(e){ toast('میکروفون اینجا در دسترس نیست. نسخهٔ نصب‌شدهٔ اپ را باز کن و اجازهٔ میکروفون بده.', 4500); }
}
function playRec(){ if(!recURL) return; pause(); if(recAudio) recAudio.pause(); recAudio=new Audio(recURL); recAudio.play().catch(()=>toast('پخش ممکن نشد')); }

/* ---------- word lookup ---------- */
function showLookup(word){
  const w=word.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,''); if(!w) return;
  pause();
  const e=encodeURIComponent(w), lang=R.lang;
  const links=[['ترجمه به فارسی', `https://translate.google.com/?sl=${lang}&tl=fa&text=${e}&op=translate`]];
  if(lang==='en') links.push(['Cambridge', `https://dictionary.cambridge.org/dictionary/english/${e}`]);
  else links.push(['dict.cc', `https://www.dict.cc/?s=${e}`], ['LEO', `https://dict.leo.org/german-english/${e}`]);
  const box=$('#lookup');
  box.innerHTML=`<div class="trow"><div class="word">${esc(w)}</div><button class="icon" data-act="closelookup">✕</button></div>
    <div class="links">${links.map(([n,u])=>`<a class="chip" href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}<button class="chip" data-act="sayword" data-w="${esc(w)}">🔊 تلفظ</button></div>`;
  box.classList.remove('hidden');
}

/* ---------- events ---------- */
document.addEventListener('click', async ev=>{
  const w = ev.target.closest('#textcard .w');
  const tc = ev.target.closest('#textcard');
  if(tc && tc.classList.contains('blind') && !tc.classList.contains('peek')){ tc.classList.add('peek'); return; }
  if(w){ showLookup(w.textContent); return; }
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, lang=el.dataset.lang || curLang;
  switch(act){
    case 'home': stopAudio(); renderHome(); break;
    case 'start': startSession(lang); break;
    case 'track': renderTrack(lang); break;
    case 'install': if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; } break;
    case 'selbook': S.tracks[curLang].bookId=el.dataset.id; save(); renderTrack(curLang); break;
    case 'delbook': {
      if(!el.classList.contains('confirm')){ el.classList.add('confirm'); el.textContent='حذف؟'; setTimeout(()=>{ if(el.isConnected){ el.classList.remove('confirm'); el.textContent='🗑'; } },3000); break; }
      const t=S.tracks[curLang], id=el.dataset.id; delete t.books[id]; bookCache.delete(id); if(!id.startsWith('sample-')) DB.del('book:'+id);
      if(t.bookId===id) t.bookId=Object.keys(t.books)[0]||null; save(); renderTrack(curLang); break; }
    case 'addtext': {
      const raw=$('#btext').value.trim(), title=$('#btitle').value.trim()||('متن '+new Date().toLocaleDateString('fa-IR')), msg=$('#impmsg');
      if(!raw){ msg.textContent='اول متن را بچسبان.'; break; }
      { const pk=parsePack(raw); if(pk){ try{ await importPack(pk); }catch(e){ msg.textContent=e.message; msg.className='msg err'; } break; } }
      try{ const ap=$('#append'); const n=await importBook(curLang, title, raw, ap&&ap.checked ? S.tracks[curLang].bookId : null); toast(`✓ ${fa(n)} جمله اضافه شد`); renderTrack(curLang); }catch(e){ msg.textContent=e.message; msg.className='msg err'; }
      break; }
    case 'search': doSearch(); break;
    case 'sharebook': shareBook(el.dataset.id); break;
    case 'smarttext': {
      const raw=$('#btext').value.trim(); { const pk=parsePack(raw); if(pk){ try{ await importPack(pk); }catch(e){ say(e.message,true); } break; } }
      if(!raw){ say('اول متن را بچسبان یا فایل/عکس انتخاب کن.', true); break; }
      pickFromText(raw, $('#btitle').value.trim()||'درس'); break; }
    case 'addpicks': {
      const txt=pickedText(); if(!txt){ toast('هیچ متنی انتخاب نشده'); break; }
      const title=$('#btitle').value.trim() || PICKS.lesson || PICKS.title || 'درس';
      try{ const ap=$('#append'); const n=await importBook(curLang, title, txt, ap&&ap.checked ? S.tracks[curLang].bookId : null); toast(`✓ ${fa(n)} جمله برای شادوینگ اضافه شد`, 4000); renderTrack(curLang); }
      catch(e){ say(e.message, true); }
      break; }
    case 'editpicks': $('#btext').value=pickedText(); $('#picks').innerHTML=''; say('متن انتخاب‌شده در کادر است؛ ویرایش کن و «افزودن همهٔ متن» را بزن.'); $('#btext').scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'rawtext': $('#btext').value=PICKS.raw||''; $('#btext').scrollIntoView({behavior:'smooth',block:'center'}); break;
    case 'ocrcancel': ocrCancel=true; el.textContent='در حال توقف…'; break;
    case 'pdfocr': {
      const a=Math.max(1, +$('#pfrom').value||1), b=Math.min(pendingPdf.pdf.numPages, +$('#pto').value||a), pdf=pendingPdf.pdf, name=pendingPdf.name;
      $('#pdfrange').innerHTML='';
      const pages=[]; for(let i=a;i<=b;i++) pages.push(i);
      try{ await processPages(pages.map(i=>async()=>pdfPageCanvas(await pdf.getPage(i))), k=>`صفحهٔ ${fa(pages[k])}`, name); }
      catch(e){ const m=$('#impmsg'); m.className='msg err'; m.textContent='تشخیص متن ناموفق بود: '+(e.message||e); }
      break; }
    case 'jump': setPos(+el.dataset.s); break;
    case 'setpos': setPos((+$('#posnum').value||1)-1); break;
    case 'restart': setPos(0); break;
    case 'testvoice': { unlockAudio(); const s = curLang==='de' ? 'Hallo! Ich lerne jeden Tag ein bisschen Deutsch.' : 'Hello! I practise a little English every day.'; speak(s, S.tracks[curLang].speed, curLang); break; }
    case 'toggle': R.playing ? pause() : runFrom(R.i); break;
    case 'replay': stopAudio(); runFrom(R.i); break;
    case 'next': goNext(); break;
    case 'prev': goPrev(); break;
    case 'toggletext': R.showText=!R.showText; updSession(); break;
    case 'rec': toggleRec(); break;
    case 'playrec': playRec(); break;
    case 'closelookup': $('#lookup').classList.add('hidden'); break;
    case 'sayword': speak(el.dataset.w, .8, R.lang); break;
    case 'quit': askQuit(); break;
    case 'resume': $('#quitov')?.remove(); runFrom(chunkStart(R.i)); break;
    case 'exit': $('#quitov')?.remove(); stopAudio(); wakeLock(false); if(!R.extra) saveSession(false); renderHome(); break;
    case 'again': againFinal(); break;
  }
});
async function doSearch(){
  const q=($('#q').value||'').trim().toLowerCase(), box=$('#results'); if(!q){ box.innerHTML=''; return; }
  const t=S.tracks[curLang], book=await getBook(curLang, t.bookId); if(!book) return;
  const hits=[]; book.sentences.forEach((s,i)=>{ if(hits.length<15 && s.toLowerCase().includes(q)) hits.push(i); });
  box.innerHTML = hits.length ? hits.map(i=>`<button class="res" dir="ltr" data-act="jump" data-s="${i}"><em>#${fa(i+1)}</em>${esc(book.sentences[i].slice(0,140))}</button>`).join('') : '<p class="sub">چیزی پیدا نشد.</p>';
}
function setPos(i){
  const t=S.tracks[curLang], m=t.books[t.bookId]; if(!m) return;
  m.pos=Math.max(0, Math.min(i, (m.total||1)-1)); m.last=null; save(); toast('✓ نقطهٔ شروع تنظیم شد'); renderTrack(curLang);
}
document.addEventListener('input', ev=>{
  if(!curLang) return; const t=S.tracks[curLang], id=ev.target.id;
  if(id==='minutes'){ t.minutes=+ev.target.value; $('#minout').textContent=fa(t.minutes)+' دقیقه'; save(); }
  if(id==='speed'){ t.speed=+ev.target.value; $('#spout').textContent='×'+fa(t.speed); save(); }
});
document.addEventListener('change', async ev=>{
  const id=ev.target.id;
  if(id==='file'){ const f=ev.target.files[0]; if(f) handleFile(f); ev.target.value=''; return; }
  if(id==='imgs'){ const fs=[...ev.target.files]; if(fs.length) handleImages(fs); ev.target.value=''; return; }
  if(!curLang) return; const t=S.tracks[curLang];
  if(id==='level'){ t.level=ev.target.value; save(); $('#lhint').textContent=profileHint(t.level); }
  if(id==='voice'){ t.voiceURI=ev.target.value; save(); }
  if(id==='warmup'){ t.warmup=ev.target.checked; save(); }
  if(id==='check'){ t.check=ev.target.checked; save(); }
  if(id==='checkReps'){ t.checkReps=+ev.target.value; save(); }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && ev.target.id==='q') doSearch(); });
async function handleFile(f){
  const msg=$('#impmsg'); msg.className='msg'; msg.textContent='در حال خواندن فایل…';
  try{
    const name=f.name.toLowerCase(); let raw;
    if(name.endsWith('.json')){ const pk=parsePack(await f.text()); if(!pk) throw new Error('این فایل بستهٔ شادوینگ معتبر نیست.'); await importPack(pk); return; }
    if(name.endsWith('.pdf')){
      const pdf = await openPdf(f), n=pdf.numPages;
      let letters=0; const probe=Math.min(n,6);
      for(let i=1;i<=probe;i++){ const tc=await (await pdf.getPage(i)).getTextContent(); letters += tc.items.map(x=>x.str||'').join('').replace(/[^\p{L}]/gu,'').length; }
      if(letters/probe < 60){   // scanned: no real text layer
        pendingPdf={pdf, name:f.name.replace(/\.[^.]+$/,'')};
        msg.textContent='';
        $('#pdfrange').innerHTML = `<div class="hint" style="margin-bottom:8px"><b>این PDF اسکن‌شده است (${fa(n)} صفحه).</b><br>متن با تشخیص نوری (OCR) روی خود گوشی خوانده می‌شود؛ هر صفحه چند ثانیه. بهتر است هر بار چند درس را جدا وارد کنی و بعداً با گزینهٔ «اضافه به انتهای کتاب» ادامه بدهی.
          <div class="row" style="margin-top:8px"><label>از صفحهٔ</label><input type="number" id="pfrom" min="1" max="${n}" value="1"><label>تا</label><input type="number" id="pto" min="1" max="${n}" value="${Math.min(n,15)}"></div>
          <button class="primary small" style="margin-top:8px" data-act="pdfocr">شروع تشخیص متن</button></div>`;
        return;
      }
      raw = await pdfToText(pdf, (p,n)=>{ msg.textContent=`در حال خواندن PDF… صفحهٔ ${fa(p)} از ${fa(n)}`; });
    }
    else if(name.endsWith('.epub')) raw = await epubToText(f);
    else raw = await f.text();
    const title = ($('#btitle').value.trim()) || f.name.replace(/\.[^.]+$/,'');
    if(raw.length <= 60000){ await pickFromText(raw, title); return; }
    const ap=$('#append'); const n = await importBook(curLang, title, raw, ap&&ap.checked ? S.tracks[curLang].bookId : null);
    toast(`✓ «${title}» با ${fa(n)} جمله اضافه شد`, 4000); renderTrack(curLang);
  }catch(e){ msg.className='msg err'; msg.textContent = e.message || 'خواندن فایل ناموفق بود.'; }
}

let pendingPdf=null;
async function handleImages(files){
  files.sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}) || a.lastModified-b.lastModified);
  try{
    await processPages(files.map(f=>()=>imageCanvas(f)), k=>`عکس ${fa(k+1)}`, 'درس '+new Date().toLocaleDateString('fa-IR'));
  }catch(e){ const m=$('#impmsg'); if(m){ m.className='msg err'; m.textContent='تشخیص متن ناموفق بود: '+(e.message||e); } }
}

/* ---------- boot ---------- */
try{ if('serviceWorker' in navigator && !isFramed) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }catch(e){}
if(!('speechSynthesis' in window)) setTimeout(()=>toast('این مرورگر از تبدیل متن به گفتار پشتیبانی نمی‌کند. Safari یا Chrome را امتحان کن.', 6000), 500);
renderHome();
</script>
